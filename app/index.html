    <!--
      Giải mã redirect từ 404.html (kỹ thuật "spa-github-pages") — PHẢI chạy
      TRƯỚC khi Vue Router đọc URL (đặt đầu <head>, script đồng bộ nên chạy
      trước mọi script khác kể cả module ở cuối <body>). Nếu URL có dạng
      /app/?/profile&uid=XXX (đã được 404.html mã hoá), khôi phục lại thành
      /app/profile?uid=XXX bằng history.replaceState trước khi router mount.
      Xem public/404.html để rõ chiều mã hoá ngược lại.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
